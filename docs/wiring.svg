<rect x="790" y="985" width="180" height="110" rx="6" fill="#333"/>
<rect x="800" y="995" width="160" height="90" fill="#64b5f6"/>
<rect x="770" y="1095" width="220" height="14" rx="4" fill="#888"/>
<text x="880" y="1135" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Windows PC</text>
<text x="880" y="1155" font-size="13" text-anchor="middle" fill="#222">USB-C cable: powers the Pi + Pi types barcodes as a keyboard</text>
<rect x="1020" y="760" width="360" height="370" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="1040" y="790" font-size="17" text-anchor="start" fill="#222" font-weight="bold">Notes</text>
<text x="1040" y="820" font-size="14" text-anchor="start" fill="#d32f2f" font-weight="bold">GPIO pins are 3.3 V only.</text>
<text x="1040" y="840" font-size="14" text-anchor="start" fill="#222">Never connect 5 V to a GPIO pin.</text>
<text x="1040" y="880" font-size="14" text-anchor="start" fill="#222">The display HAT covers pins 1–26, so the</text>
<text x="1040" y="900" font-size="14" text-anchor="start" fill="#222">trigger and beeper use free pins 30–36.</text>
<text x="1040" y="940" font-size="14" text-anchor="start" fill="#222">Trigger uses the Pi's internal pull-up;</text>
<text x="1040" y="960" font-size="14" text-anchor="start" fill="#222">pressing shorts GPIO16 to GND.</text>
<text x="1040" y="1000" font-size="14" text-anchor="start" fill="#222">Beeper: a small piezo connects directly;</text>
<text x="1040" y="1020" font-size="14" text-anchor="start" fill="#222">a magnetic (coil) buzzer needs an NPN</text>
<text x="1040" y="1040" font-size="14" text-anchor="start" fill="#222">transistor. Installer enables PWM on GPIO12.</text>
<text x="1040" y="1080" font-size="14" text-anchor="start" fill="#222">A PC port may not power Pi 5 + Brio.</text>
<text x="1040" y="1100" font-size="14" text-anchor="start" fill="#222">If it browns out, use a USB-C power/</text>
<text x="1040" y="1120" font-size="14" text-anchor="start" fill="#222">data splitter with a 5 V 5 A supply.</text>
</svg>
